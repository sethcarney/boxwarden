version: 2

# Two ecosystems, watched for different reasons.
#
# The npm tree is the obvious one. The GitHub Actions tree is the one that
# matters more here: every action in .github/workflows is pinned to a full
# commit SHA (see the note in check.yml), and a SHA does not float — which is
# the point, and also means a security fix upstream reaches this repo only if
# something opens the PR. Dependabot is that something. It rewrites both the
# SHA and the `# vX.Y.Z` comment beside it, so the two cannot drift.

updates:
  # Bun, not npm: the lockfile is bun.lock, and the npm updater neither reads
  # nor rewrites it. Pointed at the wrong ecosystem, Dependabot opens PRs that
  # bump package.json and leave the lockfile behind — which CI then rejects,
  # correctly, because check.yml installs with --frozen-lockfile.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all non-breaking bumps. Majors stay separate: electron and
      # react majors each need the app opened and looked at, and burying that
      # in a twelve-package PR is how it gets rubber-stamped.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Everything below is HELD, not declined. Each entry names the upstream
    # thing that has to move first and what to delete when it does — an ignore
    # rule with no expiry condition is how a dependency quietly stops being
    # updated. Nothing here is a judgement about the release itself; all three
    # were opened, run against CI, and failed on something this repo cannot fix
    # from inside.
    ignore:
      # Electron majors land roughly every eight weeks and each one is a
      # Chromium and Node bump underneath the app. That is a deliberate
      # upgrade with the GUI open on a real machine — see docs/roadmap.md —
      # not a PR to merge on a green tick. Minor and patch bumps (which is
      # where Electron ships its security fixes) still come through.
      - dependency-name: electron
        update-types: ['version-update:semver-major']

      # TypeScript 7 is the native compiler, and typescript-eslint refuses to
      # load against it outright ("typescript-eslint does not support TS 7.0",
      # tracked in typescript-eslint#10940 for TS >= 7.1). That takes out `bun
      # run lint` entirely — which in this repo is not a style pass but where
      # the MVVM layering rule is enforced, so a green typecheck over a dead
      # linter is the worse of the two outcomes.
      #
      # `>= 7` and not semver-major, deliberately: 6.x is the last release on
      # the JS-based compiler and is the API typescript-eslint's own error
      # message points at, so it should still arrive as a PR. tsc itself is
      # already clean on 7 — see src/renderer/assets.d.ts, which is the one
      # thing it flagged.
      #
      # Delete this once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        versions: ['>= 7']

      # Vite 8 and @vitejs/plugin-react 6 are one held item wearing two names.
      # electron-vite 5 peers on `vite: ^5 || ^6 || ^7`, and under 8's rolldown
      # backend its `externalizeDeps` silently no-ops, so the main build tries
      # to bundle dockerode's native ssh2 bindings and fails. plugin-react 6
      # peers on `vite: ^8` alone, so it cannot go first and cannot go alone.
      #
      # The full reasoning — including why the `external` array that makes the
      # build pass is not the fix — is in the version note in
      # electron.vite.config.ts. Delete both entries together, once
      # electron-vite widens its peer range.
      - dependency-name: vite
        versions: ['>= 8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>= 6']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      # codeql-action/init, /analyze and /upload-sarif are three dependencies
      # to Dependabot and one thing in reality — they must be pinned to the
      # same SHA or the analysis and the upload disagree about the bundle. One
      # PR always, majors included. scorecard.yml uses /upload-sarif too, so
      # this group spans two workflow files.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'github/codeql-action*'
        update-types:
          - minor
          - patch

  # The dev container's own base image and features. Nothing in the app
  # depends on these, but a stale base image is a stale Node, and the container
  # is where every check in this repo actually runs.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

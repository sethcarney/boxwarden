name: release

# Turns a tag into installers for all three platforms, attached to a draft
# GitHub release.
#
# The shape it has, and why:
#
#   - **The tag is the trigger, package.json is the version.** electron-builder
#     reads the version from package.json and nothing else, so the tag has to
#     agree with it or the release is named after one thing and contains
#     another. `verify` fails the run in seconds rather than after three
#     ten-minute builds — see scripts/check-release-version.mjs.
#
#   - **One job per OS, because cross-building mostly does not work.** A dmg
#     needs macOS, an NSIS installer needs Windows (or Wine), Linux targets
#     need Linux. This is the same constraint docs/running.md states for
#     building by hand; CI is how the repo stops paying it.
#
#   - **The jobs do NOT publish; a fourth job does.** electron-builder can push
#     to GitHub itself, but three jobs each creating "the" draft release race
#     each other and the loser silently makes a second one. Building to
#     workflow artefacts and collecting them in one place makes the release a
#     single atomic step with every platform's output already in hand.
#
#   - **Draft, never published automatically.** The last step of a release is a
#     human reading the notes and pressing a button. Everything up to that is
#     mechanical; that part is not.
#
# What this does NOT do: sign, notarise, or auto-update. The macOS and Windows
# builds are unsigned, which is a property of the artefacts and not of this
# workflow — docs/releasing.md says what that means for whoever downloads
# them, and docs/roadmap.md#6-packaging--signing-notarisation-updates tracks
# closing it.

on:
  push:
    tags:
      # v-prefixed semver only. `verify` re-checks the exact spelling; this
      # pattern's job is to keep unrelated tags from starting a build at all.
      - 'v*'
  # The dry run. Builds all three platforms and uploads the artefacts without
  # creating a release, so the pipeline can be exercised — and the installers
  # can be opened on a real machine — before a tag exists to be lived with.
  workflow_dispatch:

# A release is not cancellable-in-progress the way a PR check is: a half-run
# matrix leaves a draft with two platforms in it. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can fail cheaply, before anything expensive starts.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, like every action in this repo — see the note in check.yml
      # for why the tag alone is not a version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # A tag can point at any commit, including one that never went through a
      # pull request. check.yml gates main; it does not gate this. Re-running
      # the same script is a minute against a release nobody can un-publish.
      - name: Check
        run: bun run check

      - name: Verify the version
        run: bun run check:release-version

  # ---------------------------------------------------------------------------
  # The builds. `dist:<os>` is the same script a developer runs locally, so CI
  # and a hand-built installer cannot drift apart; `--publish never` is
  # appended because electron-builder's default policy would otherwise try to
  # upload on a tag build.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    strategy:
      # One platform failing should not hide whether the other two are fine —
      # on a release, knowing "only Windows is broken" is the difference
      # between a fix and an investigation.
      fail-fast: false
      matrix:
        include:
          # macOS on the arm64 runner, building both arches: electron-builder
          # downloads the x64 Electron distribution and packages it, which is
          # the one cross-build in this matrix that genuinely works.
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here, unlike check.yml: packaging is
      # precisely the job that needs the binary.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bash on all three, including the Windows runner, so `-- --publish
      # never` reaches electron-builder identically everywhere rather than
      # depending on how PowerShell forwards `--` to a native command.
      - name: Build installers
        shell: bash
        run: bun run ${{ matrix.script }} -- --publish never
        env:
          # Nothing CODE-signs these builds. Without this, electron-builder
          # searches the runner's keychain, finds nothing, and reports it as a
          # warning buried in an otherwise green log — so an unsigned release
          # looks exactly like a signed one from the outside. Say it
          # deliberately instead, and let docs/releasing.md be the place it is
          # admitted.
          #
          # This is a different thing from the cosign signatures the publish
          # job attaches, and the two are not substitutes. Cosign proves these
          # exact bytes came out of this exact workflow, to someone who runs a
          # verify command. Code signing is what stops Gatekeeper and
          # SmartScreen from warning the other 99% of users who will not.
          # docs/supply-chain.md#what-signing-does-and-does-not-buy.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Explicit patterns rather than `release/`: electron-builder also leaves
      # the unpacked app directories (mac/, linux-unpacked/, win-unpacked/) and
      # its own debug config in there. Uploading those would multiply the
      # artefact size for output nobody installs.
      #
      # latest*.yml is included even though nothing consumes it yet — it is the
      # update manifest, it costs a kilobyte, and a release missing it cannot
      # be retrofitted as an auto-update source later.
      - name: Upload artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boxwarden-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  # ---------------------------------------------------------------------------
  # The one place a release is created, and the only job that can write.
  #
  # It also signs, and the ordering there is the delicate part: the signatures
  # have to cover the artefacts as uploaded, so they are produced BEFORE `gh
  # release create` and attached in the same call. Signing afterwards would
  # leave a window in which a draft exists with unsigned assets, and a
  # signature uploaded separately is one a failed second step can silently
  # omit.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    # Dry runs stop at the artefacts. Only a tag produces a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: cosign exchanges this job's OIDC token for a
      # short-lived Fulcio certificate that records WHICH workflow, at which
      # ref, in which repo, did the signing. That identity is the whole value —
      # there is no private key to store, rotate, or leak, and no key for an
      # attacker to steal and sign a release with.
      id-token: write
    # Consumed by the provenance job below, which cannot see this job's files.
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --generate-notes diffs against the previous tag, which is not in a
          # shallow clone. Without this the first release is fine and every
          # later one silently gets notes covering the whole history.
          fetch-depth: 0
          # gh uses GH_TOKEN from the environment below, not the credential
          # checkout would otherwise leave in .git/config.
          persist-credentials: false

      # No dependency install: this job reads package.json with the runner's
      # own node and shells out to gh. Nothing here builds.
      - name: Download artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: boxwarden-*
          merge-multiple: true
          path: artefacts

      - name: List what is about to be released
        run: ls -lh artefacts

      # cosign itself is pinned by version, not just by the installer's SHA.
      # The installer downloads whatever release it is told to, so an unpinned
      # `cosign-release` would make the signing tool a floating dependency of a
      # job that exists to make things non-floating.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # The checksum file is the cheap half of verification: no tooling beyond
      # coreutils, and it is what the vast majority of people who check
      # anything will actually run. It is generated from inside the directory
      # so the names in it are bare filenames, which is what `sha256sum -c`
      # expects to find next to it after a download.
      #
      # It is also the input to the SLSA provenance below, which is why it is
      # built before signing rather than alongside: signing adds files, and
      # provenance must attest the installers, not the signatures over them.
      - name: Compute checksums
        working-directory: artefacts
        run: |
          set -euo pipefail
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # One Sigstore bundle per installer: `<name>.sigstore.json`, holding the
      # signature, the Fulcio certificate that ties it to this workflow, and
      # the transparency-log entry, in one file `cosign verify-blob --bundle`
      # takes on its own.
      #
      # One file rather than the older `.sig` + `.pem` pair because cosign v3
      # removed `--output-signature` and `--output-certificate` from
      # `sign-blob` — the bundle IS the format now. `.sigstore.json` is also
      # the spelling Sigstore's own tooling expects, so a reader who has
      # verified anything else recognises it.
      #
      # COSIGN_YES because there is no terminal here to answer the "this will
      # be recorded in a public transparency log" prompt. That recording is the
      # point — it is what makes a signature that was never published
      # detectable — and it means the artefact names of every release become
      # public at release time, which for a public repo costs nothing.
      #
      # sha256sums.txt is signed too. An attacker who could replace the
      # checksum file could not forge an installer, but could make the cheap
      # verification path agree with a swapped one.
      - name: Sign artefacts with cosign
        working-directory: artefacts
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for file in *; do
            case "$file" in *.sigstore.json) continue ;; esac
            echo "Signing $file"
            cosign sign-blob "$file" --bundle "$file.sigstore.json"
          done
          ls -lh

      # base64 of the checksum file, handed to the SLSA generator as the set of
      # subjects it is attesting. `-w0` because the generator expects one line.
      - name: Compute hashes for SLSA provenance
        id: hash
        working-directory: artefacts
        run: echo "hashes=$(base64 -w0 < sha256sums.txt)" >> "$GITHUB_OUTPUT"

      # `1.0.0-rc.1` is marked as a prerelease so it does not become the
      # "latest release" the README's download link resolves to. The rule lives
      # in the same module the version check uses, rather than being
      # re-derived here as a grep for a hyphen.
      - name: Decide prerelease
        id: kind
        run: |
          version=$(node -p "require('./package.json').version")
          prerelease=$(node -e "import('./scripts/check-release-version.mjs').then(m => process.stdout.write(String(m.isPrerelease('$version'))))")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # --draft: the notes get read and edited before anyone can download this.
      # --verify-tag: refuses if the tag has disappeared from the remote since
      # the run started, which is the one way an artefact set can outlive the
      # commit it claims to be built from.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            ${{ steps.kind.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            artefacts/*

  # ---------------------------------------------------------------------------
  # SLSA Build L3 provenance: a signed statement of which commit, which
  # workflow and which runner produced the hashes above.
  #
  # Why a separate reusable workflow rather than a step: the whole guarantee
  # rests on the provenance being generated somewhere the build cannot reach.
  # A step in the publish job runs in the same process space as the thing it is
  # attesting, so a compromised build could write its own provenance. This runs
  # in an isolated workflow whose identity is the generator's, not ours, and
  # that is exactly what a verifier checks.
  #
  # Note the tag reference. Every other action here is SHA-pinned; this one
  # MUST NOT be. The generator reads `github.action_ref` at runtime to decide
  # which of its own binary releases to download, and a SHA there resolves to
  # nothing. It is a documented upstream requirement:
  # https://github.com/slsa-framework/slsa-github-generator#referencing-slsa-builders-and-generators
  # ---------------------------------------------------------------------------
  provenance:
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      # Attaches multiple.intoto.jsonl to the release the publish job created.
      # It is still a draft at this point, which gh resolves by name.
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      # Said explicitly rather than relying on the generator's default of
      # "leave an existing release's draft flag alone". The one thing this
      # workflow must never do is publish a release nobody has read.
      draft-release: 'true'

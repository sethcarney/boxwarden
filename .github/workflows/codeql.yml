name: codeql

# Static analysis, and the answer to Scorecard's SAST check.
#
# `bun run check` already runs a type-aware ESLint over both TS projects, and
# that catches a great deal — but it is a lint, scoped to one file's types at a
# time. CodeQL asks a different question: it follows data across module
# boundaries from a source to a sink. In an app whose whole job is to take
# attacker-influenced strings (container labels, process tables, a
# `devcontainer.json` found on disk) and turn them into an argv array or a URI,
# that is exactly the shape of bug worth spending a runner on.
#
# Three choices worth stating:
#
#   - **`javascript-typescript`, one language.** The renderer and the main
#     process are the same language to CodeQL; splitting them would double the
#     runtime for one merged result.
#
#   - **`build-mode: none`.** JS/TS is analysed from source. Running
#     `electron-vite build` first would only hand CodeQL bundled, minified
#     output — the same code with the variable names removed. check.yml is
#     where "does it still bundle" is asked.
#
#   - **`security-extended`.** The default suite is tuned for a low false
#     positive rate on any repo; the extended suite adds the queries this one
#     actually cares about (command injection, path traversal, unsafe
#     deserialisation). A handful of extra alerts to triage is a good trade for
#     the class of bug that would otherwise reach `spawn`.
#
# On a schedule as well as on push, because a query added upstream next month
# finds a bug in code committed last month, and nothing about that commit will
# ever trigger a push run again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1' # Weekly on Monday

permissions: read-all

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: '/language:javascript-typescript'

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The authoritative CSP is set as a response header in src/main/index.ts —
      a header cannot be stripped by injected markup, a meta tag can. This tag
      is the belt to that braces, and it is what applies if the renderer is
      ever opened outside Electron (for example in a browser during UI work).

      This is the PRODUCTION policy. In dev, the boxwarden:dev-meta-csp plugin
      in electron.vite.config.ts rewrites script-src here to admit Vite's inline
      react-refresh preamble; edit script-src with that in mind, since the two
      policies have to stay relaxed together or the renderer will not mount.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:*; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>boxwarden</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
